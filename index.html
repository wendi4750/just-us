.paper{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:6px;box-shadow:7px 7px 0 var(--accent);padding:26px 18px 22px;width:100%;max-width:440px;align-self:flex-start;margin-top:3vh;transform:rotate(-.6deg)}
.paper::before{content:"";position:absolute;inset:6px;border:1.5px dashed var(--line);border-radius:3px;pointer-events:none}
.tag{position:absolute;top:-14px;right:20px;background:var(--accent);color:#fff;font-family:"Lilita One","DM Sans",system-ui,sans-serif;font-size:15px;padding:3px 14px;border:2px solid var(--ink);transform:rotate(2deg)}
.step{font-size:13px;color:var(--muted);text-align:center;letter-spacing:1px;margin-bottom:4px}
h1{font-family:"Lilita One","DM Sans",system-ui,sans-serif;font-weight:400;font-size:30px;line-height:1.35;text-align:center;margin:4px 0 4px}
h1 u{text-decoration:underline wavy var(--accent);text-underline-offset:7px}
.sub{color:var(--muted);text-align:center;margin:0 0 16px;line-height:1.8}
button{font:inherit;cursor:pointer;color:var(--text)}
.big{width:100%;background:var(--accent);color:#fff;border:2.5px solid var(--ink);border-radius:8px;padding:12px;font-size:17px;font-weight:700;box-shadow:4px 4px 0 var(--ink);margin-top:14px}
.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.big:disabled{opacity:.4;box-shadow:none}
.small{background:none;border:2px dashed var(--muted);border-radius:8px;padding:10px 18px;font-size:15px}
.row0{display:flex;gap:12px;justify-content:center;align-items:center;min-height:76px;position:relative}
.row0 .big{width:auto;margin:0;padding:12px 22px}
.item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-bottom:1.5px solid var(--line);padding:11px 4px;text-align:right;font-size:17px}
.item .e{font-size:24px;width:32px;text-align:center}
.item .dots{flex:1;border-bottom:2px dotted var(--muted);height:1px;opacity:.6;margin-top:10px}
.item .st{width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:15px;color:transparent}
.item.sel{background:var(--accent2)}
.item.sel .st{background:var(--accent);color:#fff;transform:rotate(-12deg)}
.item.sel .n{font-weight:700}
label{display:block;color:var(--muted);font-size:14px;margin:14px 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:11px;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--accent2);border:2px solid var(--ink);border-radius:20px;padding:6px 14px;font-size:14px}
.thanks{background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:6px;padding:9px;text-align:center;font-weight:700;margin-bottom:10px;transform:rotate(1deg)}
.receipt{background:var(--accent2);border-top:2px dashed var(--ink);border-bottom:2px dashed var(--ink);padding:14px 12px;line-height:2;white-space:pre-wrap;text-align:right;margin:6px 0 4px}
.bar{height:34px;margin:10px 0 2px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 13px,transparent 13px 15px)}
.links{display:flex;gap:8px;margin-top:10px}
.links a{flex:1;text-align:center;color:var(--text);text-decoration:none;border:2px solid var(--ink);border-radius:8px;padding:10px 4px;font-size:14px;background:var(--card)}
.det{border:2px solid var(--ink);border-radius:8px;padding:10px 12px 12px;margin-bottom:12px;background:var(--card)}
.dt{font-weight:700;font-size:18px}
.lvl{display:flex;gap:6px}
.lvl button{flex:1;border:2px solid var(--ink);border-radius:8px;background:var(--card);padding:8px 0;font-size:16px;font-weight:700}
.lvl button.on{background:var(--accent);color:#fff}

body{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.paper{display:none}.paper.on{display:block}.paper:nth-of-type(even){transform:rotate(.6deg)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 24px));display:flex;gap:3px;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:5px;z-index:5}
nav button{flex:1;border:0;background:none;border-radius:10px;padding:5px 0;font-size:10px;line-height:1.3;font-weight:700}
nav button span{display:block;font-size:20px}nav button.on{background:var(--accent2);box-shadow:inset 0 0 0 2px var(--ink)}
#msgs{height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px 10px}

function msg(){
 var L=S.acts.map(function(t){var d=D(t),k=kind(t),s="• "+t;
  if(k==="movie")s+="\n   🎞 "+tr("m_film")+": "+d.movie.trim();
  if(k==="kiss")s+="\n   🔥 "+tr("m_lvl")+": "+d.lvl+" / 5 "+"💋".repeat(d.lvl);
  return s+"\n   📍 "+tr("m_where")+": "+d.where.trim()}).join("\n");
 return tr("m_hi")+L+"\n\n📅 "+tr("m_day")+": "+fa(S.date)+"\n⏰ "+tr("m_time")+": "+S.time+tr("m_bye")}
function render(){
 q("tag").textContent=TAGS[S.step];
 var h='<div class="step">'+(S.step+1)+' / 5</div>';
 if(S.step===0){
  h+='<h1>'+tr("s0h")+'</h1><p class="sub">'+tr("s0s")+'</p><div class="row0"><button class="big" id="yes">'+tr("yes")+'</button><button class="small" id="no">'+tr("no")+'</button></div>';
 }else if(S.step===1){
  h+=(S.thanks?'<div class="thanks">'+tr("thx")+'</div>':'')+'<h1>'+tr("s1h")+'</h1><p class="sub">'+tr("s1s")+'</p>'+ACTS.map(function(a){var t=a[0]+" "+a[1],on=S.acts.indexOf(t)>-1;return '<button class="item'+(on?" sel":"")+'" data-t="'+t+'"><span class="e">'+a[0]+'</span><span class="n">'+a[1]+'</span><span class="dots"></span><span class="st">✓</span></button>'}).join("")+'<button class="big" id="next" '+(S.acts.length?"":"disabled")+'>'+tr("s1b")+'</button>';
 }else if(S.step===2){
  h+='<h1>'+tr("s2h")+'</h1><p class="sub">'+tr("s2s")+'</p>'+S.acts.map(function(t){
   var d=D(t),k=kind(t),b='<div class="det"><div class="dt">'+t+'</div>';
   if(k==="kiss")b+='<label>'+tr("l_lvl")+'</label><div class="lvl">'+[1,2,3,4,5].map(function(v){return '<button data-t="'+t+'" data-v="'+v+'" class="'+(d.lvl>=v?"on":"")+'">'+v+'</button>'}).join("")+'</div>';
   if(k==="movie")b+='<label>'+tr("l_film")+'</label><input class="txt" data-t="'+t+'" data-k="movie" placeholder="'+tr("p_film")+'" value="'+esc(d.movie)+'">';
   return b+'<label>'+tr("l_where")+'</label><input class="txt" data-t="'+t+'" data-k="where" placeholder="'+(k==="kiss"?tr("p_kiss"):tr("p_place"))+'" value="'+esc(d.where)+'"></div>'}).join("")+'<button class="big" id="next" '+(ready()?"":"disabled")+'>'+tr("next")+'</button>';
 }else if(S.step===3){
  var iso=new Date().toISOString().slice(0,10);
  h+='<h1>'+tr("s3h")+'</h1><p class="sub">'+tr("s3s")+'</p><label>'+tr("l_day")+'</label><input type="date" id="d" min="'+iso+'" value="'+S.date+'"><label>'+tr("l_time")+'</label><input type="time" id="t" value="'+S.time+'"><div class="chips">'+[["12:00","12:00"],["16:00","16:00"],["18:30","18:30"],["20:00","20:00"]].map(function(c){return '<button class="chip" data-v="'+c[1]+'">'+c[0]+'</button>'}).join("")+'</div><button class="big" id="next" '+(S.date&&S.time?"":"disabled")+'>'+tr("s3b")+'</button>';
 }else{
  h+='<h1>'+tr("s4h")+'</h1><p class="sub">'+tr("s4s")+'</p><div class="receipt" id="res"></div><div class="bar"></div><button class="big" id="share">'+tr("rcpt")+'</button><div class="sub" id="stat" style="margin:10px 0 0"></div>';
 }
 app.innerHTML=h;bind();
}
function bind(){
 if(S.step===0){
  q("yes").onclick=function(){S.yes=true;S.step=1;render()};
  var no=q("no");
  var run=function(){
   S.dodge++;if(S.dodge>=5){S.thanks=true;no.remove();q("yes").textContent=tr("ok_fine");return}
   no.style.position="absolute";
   no.style.left=Math.round(Math.random()*60)+"%";no.style.top=Math.round(Math.random()*40)+"px";
   if(S.dodge>=3)no.textContent=tr("sure");
  };
  no.onmouseover=run;no.onclick=run;no.ontouchstart=function(e){e.preventDefault();run()};
 }
 if(S.step===1){
  document.querySelectorAll(".item").forEach(function(b){b.onclick=function(){var t=b.dataset.t,i=S.acts.indexOf(t);if(i>-1)S.acts.splice(i,1);else S.acts.push(t);render()}});
  q("next").onclick=function(){S.step=2;render()};
 }
 if(S.step===2){
  var up=function(){q("next").disabled=!ready()};
  document.querySelectorAll(".txt").forEach(function(i){i.oninput=function(){D(i.dataset.t)[i.dataset.k]=i.value;up()}});
  document.querySelectorAll(".lvl button").forEach(function(b){b.onclick=function(){D(b.dataset.t).lvl=+b.dataset.v;render()}});
  q("next").onclick=function(){S.step=3;render()};
 }

  var upd=function(){q("next").disabled=!(S.date&&S.time)};
  q("d").onchange=function(){S.date=this.value;upd()};
  q("t").onchange=function(){S.time=this.value;upd()};
  document.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){S.time=c.dataset.v;q("t").value=S.time;upd()}});
  q("next").onclick=function(){S.step=4;render()};
 }

  var m=msg();
  q("res").textContent=m;
  var st=q("stat"),btn=q("share");
  if(S.sent){btn.disabled=true;btn.textContent=tr("sent")}
  btn.onclick=function(){
   if(window.saveDate){window.saveDate(m,btn,st);return}if(TOKEN.indexOf("PASTE")>=0){
    if(navigator.share){navigator.share({text:m}).catch(function(){})}
    else{try{navigator.clipboard.writeText(m);st.textContent=tr("copied")}catch(x){}}
    return}
   btn.disabled=true;btn.textContent=tr("sending");
   sendToMe(m).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw 0;
    S.sent=true;btn.textContent=tr("sent");st.textContent=tr("sent2");
   }).catch(function(){btn.disabled=false;btn.textContent=tr("rcpt");st.textContent=tr("fail")});
  };
 }
}
render();
